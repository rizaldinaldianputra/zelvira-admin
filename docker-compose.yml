services:
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.zelvira.co.id/api}
        NEXT_PUBLIC_STORAGE_URL: ${NEXT_PUBLIC_STORAGE_URL:-https://s3.zelvira.co.id}
    container_name: zelvira-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NODE_OPTIONS=--max-old-space-size=768
      - INTERNAL_API_URL=${INTERNAL_API_URL:-https://api.zelvira.co.id/api}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.zelvira.co.id/api}
      - NEXT_PUBLIC_STORAGE_URL=${NEXT_PUBLIC_STORAGE_URL:-https://s3.zelvira.co.id}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3001/admin >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          cpus: '0.2'
          memory: 384M
    networks:
      - zelvira-admin-network

networks:
  zelvira-admin-network:
    driver: bridge
    name: zelvira-admin-network
